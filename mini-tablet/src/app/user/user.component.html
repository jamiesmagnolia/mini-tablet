<!-- Main Header -->
<div class="title-container">
    <h1>Please Log In Using Your Credentials</h1>
    <p>There are only a limited number of attempts.</p>
</div>

<!-- Log-in Form Card -->
<div class="card-container">
    <section>
        <mat-card class="login-card">

            <mat-card-content>

              <div class="form-row">
                <label for="username">Username: </label>
                <input id="username" type="text" />
              </div>

              <div class="form-row">
                <label for="password">Password: </label>
                <input id="password" type="password" />
              </div>

              <div class="form-row">
                <button>Enter</button>
                <!-- <button mat-flat-button>Enter</button> -->
              </div>

            </mat-card-content>

          </mat-card>          
    </section>
</div>
